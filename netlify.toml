[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# PREVIEW ONLY: keep the whole site out of search engines until launch.
# Remove this block when meconsulting.com points here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Keep the admin page out of search engines
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Photos and icons rarely change; let browsers cache them
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Old Squarespace addresses → new pages
[[redirects]]
  from = "/thefamily"
  to = "/team/"
  status = 301
[[redirects]]
  from = "/mecareers"
  to = "/careers/"
  status = 301
[[redirects]]
